apiVersion: v1
kind: Service
metadata:
  name: heart-api
  namespace: heart-mlops
  labels:
    app: heart-api
spec:
  # LoadBalancer: public IP on GKE/EKS/AKS; on Minikube run `minikube tunnel`,
  # on Docker Desktop it is exposed on localhost automatically.
  type: LoadBalancer
  selector:
    app: heart-api
  ports:
    - name: http
      port: 80
      targetPort: http
