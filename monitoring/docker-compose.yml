# Local monitoring stack: API + Prometheus + Grafana
#   docker compose -f monitoring/docker-compose.yml up --build
#   API        http://localhost:8000/docs
#   Prometheus http://localhost:9090
#   Grafana    http://localhost:3000   (admin / admin) -> MLOps / Heart Disease API
# Requires models/model.joblib (run `python -m heart.train` first).
services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: heart-disease-api:1.0.0
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../k8s/monitoring/heart-api-dashboard.json:/var/lib/grafana/dashboards/heart-api-dashboard.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
